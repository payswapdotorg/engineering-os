name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test
        env:
          DATABASE_URL: "file:./db/ci.db"

      # Production-build gate (release-truth pass, 2026-10-22): the standalone
      # build must succeed on every push/PR, independent of the packaging job.
      - name: Production build (standalone)
        run: bun run build
        env:
          DATABASE_URL: "file:./db/ci.db"

  # Engine validation harness (release-truth pass, 2026-10-22): the real
  # adapters run against the committed fixture corpus with analytical ground
  # truths on CI, exactly like `bun run validate:engines` locally. An
  # all-skip run is NOT a pass — the assertion below fails the job if any
  # case was skipped or the harness did not run.
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Engine venv cache (Slice 10, round 3): the pin file is the cache key.
      # Rounds 1-2 history: a cold run rebuilt the whole OCCT/IfcOpenShell set
      # and blew the job's 30-min ceiling (run 39873759828); the wheel-cache
      # layer still left a 30+ min venv build on slow PyPI nights (run
      # 39878513900's e2e install). A restored VENV skips pip entirely; a
      # restored-but-broken venv (image python drift) self-heals via the cold
      # path — the import gate below is the arbiter, never a silent pass.
      - name: Engine venv cache
        uses: actions/cache@v4
        with:
          path: /tmp/eos-engines
          key: eos-engines-venv-${{ runner.os }}-${{ hashFiles('tests/validation/engines-requirements.txt') }}-v1

      - name: Install engineering engines (the harness-validated set)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice libglu1-mesa libopengl0 tesseract-ocr
          if [ -x /tmp/eos-engines/bin/python ] && /tmp/eos-engines/bin/python -c 'import cadquery, ifcopenshell, gmsh, pandapower, simpy' 2>/dev/null; then
            echo "engine venv restored from cache — skipping pip"
          else
            rm -rf /tmp/eos-engines
            python3 -m venv /tmp/eos-engines
            /tmp/eos-engines/bin/pip install --quiet --upgrade pip
            /tmp/eos-engines/bin/pip install --quiet -r tests/validation/engines-requirements.txt
          fi
          /tmp/eos-engines/bin/python -c 'import cadquery, ifcopenshell, gmsh, pandapower, simpy; print("engines importable")'
          soffice --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Engine validation harness (real adapters, analytical ground truth)
        env:
          EOS_PYTHON: /tmp/eos-engines/bin/python
          DATABASE_URL: "file:./db/ci-engines.db"
        run: |
          bun run validate:engines
          python3 - <<'PY'
          import json
          r = json.load(open("tests/validation/report.json"))
          s = r["summary"]
          assert s["fail"] == 0, f"engine harness failures: {s['fail']}"
          assert s["skip"] == 0, f"engine harness skips: {s['skip']} — an all-skip run is NOT a pass"
          assert s["pass"] > 0 and not s["notRun"], "engine harness did not run"
          print(f"engine harness: {s['pass']}/{s['total']} passed, 0 failed, 0 skipped")
          PY

  # End-to-end acceptance gate (release-truth pass 2026-10-22; six suites since
  # the isolation slice 10): the golden-path shell suites run against a real
  # dev server on a real database through the real NextAuth sign-in flow, with
  # the real engineering engines installed — the same evidence standard as the
  # local acceptance record.
  #
  # TWO gate fixes from the Slice-10 CI iteration (run 39877259925 forensics —
  # honest history, the ninth pass's "all-green" e2e job was green-but-broken):
  #  1. `set -o pipefail` in EVERY step — the runner's default shell is
  #     bash -e WITHOUT pipefail, so `bash suite | tee` returned TEE's exit code
  #     and suite failures were invisible (p3/p4/p5 crashed mid-run at their
  #     demo-dataset regression markers and the steps stayed green).
  #  2. `--keep-name "Harbour View Extension"` on every pre-clean except
  #     takeoff's — the plain --all pre-clean silently deleted the canonical
  #     demo dataset that three suites' regression markers assert against
  #     (p3 block 14, p4 #49, p5 #46-47). Takeoff rebuilds the dataset each
  #     run; the later suites keep it alive and clean only their own probes.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Engine venv cache (Slice 10, round 3): the pin file is the cache key.
      # Rounds 1-2 history: a cold run rebuilt the whole OCCT/IfcOpenShell set
      # and blew the job's 30-min ceiling (run 39873759828); the wheel-cache
      # layer still left a 30+ min venv build on slow PyPI nights (run
      # 39878513900's e2e install). A restored VENV skips pip entirely; a
      # restored-but-broken venv (image python drift) self-heals via the cold
      # path — the import gate below is the arbiter, never a silent pass.
      - name: Engine venv cache
        uses: actions/cache@v4
        with:
          path: /tmp/eos-engines
          key: eos-engines-venv-${{ runner.os }}-${{ hashFiles('tests/validation/engines-requirements.txt') }}-v1

      - name: Install engineering engines (the harness-validated set)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice libglu1-mesa libopengl0 tesseract-ocr
          if [ -x /tmp/eos-engines/bin/python ] && /tmp/eos-engines/bin/python -c 'import cadquery, ifcopenshell, gmsh, pandapower, simpy' 2>/dev/null; then
            echo "engine venv restored from cache — skipping pip"
          else
            rm -rf /tmp/eos-engines
            python3 -m venv /tmp/eos-engines
            /tmp/eos-engines/bin/pip install --quiet --upgrade pip
            /tmp/eos-engines/bin/pip install --quiet -r tests/validation/engines-requirements.txt
          fi
          /tmp/eos-engines/bin/python -c 'import cadquery, ifcopenshell, gmsh, pandapower, simpy; print("engines importable")'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare dev database + environment
        run: |
          set -euo pipefail
          mkdir -p db
          SECRET="$(openssl rand -base64 32)"
          cat > .env <<EOF
          DATABASE_URL=file:./db/custom.db
          EOS_PYTHON=/tmp/eos-engines/bin/python
          NEXTAUTH_SECRET=${SECRET}
          NEXTAUTH_URL=http://localhost:3000
          EOF
          bunx prisma db push --skip-generate

      - name: Start dev server (scripts/dev-server.sh exports .env at exec time)
        run: |
          set -euo pipefail
          nohup bash scripts/dev-server.sh > dev.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 3
            if curl -sf http://localhost:3000/api/status > /dev/null; then
              echo "dev server up after ~$((i * 3))s"; exit 0
            fi
          done
          echo "dev server did not come up"; tail -60 dev.log; exit 1

      - name: "e2e-takeoff (62 PASS expected — Slice 15 vector takeoff +11, AC-VT-01…09)"
        run: |
          set -o pipefail
          bun scripts/dev-db-cleanup.ts --all
          bash scripts/e2e-takeoff.sh 2>&1 | tee /tmp/e2e-takeoff.log

      - name: e2e-p2-modelviewer (86 PASS expected)
        run: |
          set -o pipefail
          bun scripts/dev-db-cleanup.ts --all --keep-name "Harbour View Extension"
          bash scripts/e2e-p2-modelviewer.sh 2>&1 | tee /tmp/e2e-p2.log

      - name: e2e-p3-hardening (40 PASS expected)
        run: |
          set -o pipefail
          bun scripts/dev-db-cleanup.ts --all --keep-name "Harbour View Extension"
          bash scripts/e2e-p3-hardening.sh 2>&1 | tee /tmp/e2e-p3.log

      - name: e2e-p4-workflows (49 PASS expected)
        run: |
          set -o pipefail
          bun scripts/dev-db-cleanup.ts --all --keep-name "Harbour View Extension"
          bash scripts/e2e-p4-workflows.sh 2>&1 | tee /tmp/e2e-p4.log

      - name: e2e-p5-disciplines (47 PASS expected)
        run: |
          set -o pipefail
          bun scripts/dev-db-cleanup.ts --all --keep-name "Harbour View Extension"
          bash scripts/e2e-p5-disciplines.sh 2>&1 | tee /tmp/e2e-p5.log

      - name: e2e-p6-isolation (80 PASS expected)
        run: |
          set -o pipefail
          bun scripts/dev-db-cleanup.ts --all --keep-name "Harbour View Extension"
          bash scripts/e2e-p6-isolation.sh 2>&1 | tee /tmp/e2e-p6.log

      # Slice 11 (agent-planning-contract §8): the SEVENTH suite. Part A (the
      # contract surface — AC-P1…P8) always runs green without an LLM; Part B
      # (the LIVE planner round trip — AC-P9…P11) self-skips honestly on
      # runners without an LLM (probePlannerLlm probe; the engine-harness skip
      # precedent), so the suite's PASS count is runner-dependent and NOT
      # pinned in the step name — the suite enforces its own Part-A floor.
      - name: e2e-p7-planner (Part A always; Part B live-LLM or honest skip)
        run: |
          set -o pipefail
          bun scripts/dev-db-cleanup.ts --all --keep-name "Harbour View Extension"
          bash scripts/e2e-p7-planner.sh 2>&1 | tee /tmp/e2e-p7.log

      - name: Upload server + suite logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            dev.log
            /tmp/e2e-*.log
          if-no-files-found: warn
          retention-days: 7

  # Slice 12 (ADR-0003; closes known-limitation #2's open half): the product
  # RUNTIME on a REAL PostgreSQL. The db-portability job below proves the
  # schema/deployment path; this job proves the other half — dev-server
  # sessions, NextAuth, the real engines and ALL SEVEN e2e suites against a
  # live postgres:16 service, through scripts/postgres-runtime-drill.sh —
  # the SAME artifact as the local drill (parity by shared script, not by
  # paraphrase). The script's provider gate refuses to run the battery
  # unless /api/status honestly reports dbProvider "postgresql", so a
  # sqlite-backed server can never produce false drill PASSes. p7's live-LLM
  # Part B self-skips on runners (engine-harness skip precedent) — the suite
  # enforces its own Part-A floor, so no count is pinned here.
  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Job-level: `prisma validate` (inside the drill script) must resolve
      # env("DATABASE_URL"); CI has no .env file.
      DATABASE_URL: postgresql://eos:eos@localhost:5432/eos_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eos
          POSTGRES_PASSWORD: eos
          POSTGRES_DB: eos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Same venv cache as the e2e job (shared key: the pin file hash).
      - name: Engine venv cache
        uses: actions/cache@v4
        with:
          path: /tmp/eos-engines
          key: eos-engines-venv-${{ runner.os }}-${{ hashFiles('tests/validation/engines-requirements.txt') }}-v1

      - name: Install engineering engines (the harness-validated set)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice libglu1-mesa libopengl0 tesseract-ocr
          if [ -x /tmp/eos-engines/bin/python ] && /tmp/eos-engines/bin/python -c 'import cadquery, ifcopenshell, gmsh, pandapower, simpy' 2>/dev/null; then
            echo "engine venv restored from cache — skipping pip"
          else
            rm -rf /tmp/eos-engines
            python3 -m venv /tmp/eos-engines
            /tmp/eos-engines/bin/pip install --quiet --upgrade pip
            /tmp/eos-engines/bin/pip install --quiet -r tests/validation/engines-requirements.txt
          fi
          /tmp/eos-engines/bin/python -c 'import cadquery, ifcopenshell, gmsh, pandapower, simpy; print("engines importable")'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare environment (.env with the PostgreSQL runtime URL)
        run: |
          set -euo pipefail
          SECRET="$(openssl rand -base64 32)"
          cat > .env <<EOF
          DATABASE_URL=postgresql://eos:eos@localhost:5432/eos_ci
          EOS_PYTHON=/tmp/eos-engines/bin/python
          NEXTAUTH_SECRET=${SECRET}
          NEXTAUTH_URL=http://localhost:3000
          EOF

      - name: PostgreSQL runtime drill (init path + client regen + provider gate + all seven suites)
        run: |
          set -o pipefail
          bash scripts/postgres-runtime-drill.sh --url "$DATABASE_URL" --start-server 2>&1 | tee /tmp/drill-run.log

      - name: Assert the drill summary honestly reports every suite green
        run: |
          set -euo pipefail
          for s in takeoff p2 p3 p4 p5 p6 p7; do
            grep -E "^$s=[0-9]+ PASS / 0 FAIL" /tmp/drill-run.log \
              || { echo "suite $s missing or not green in the drill summary:"; tail -40 /tmp/drill-run.log; exit 1; }
          done
          grep -q "ALL SUITES GREEN — the product runtime is verified on real PostgreSQL" /tmp/drill-run.log

      - name: Upload server + suite logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-runtime-logs
          path: |
            dev.log
            /tmp/drill-*.log
          if-no-files-found: warn
          retention-days: 7

  # PostgreSQL portability gate (release-truth pass, 2026-10-22, ADR-0003
  # addendum): the production deployment path is exercised against a LIVE
  # postgres:16 service on every push — schema regeneration + drift check,
  # prisma validate, the production init SQL (migrate diff from empty)
  # applied with db execute, db push confirming sync, and a live-vs-model
  # diff that must contain no DDL. Honest scope: this validates the schema,
  # SQL and deployment procedure on real PostgreSQL; the product-RUNTIME
  # drill now lives in the postgres-runtime job above (Slice 12).
  db-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Job-level: `prisma validate` must also resolve env("DATABASE_URL")
      # (CI has no .env file — a local run would mask this failure).
      DATABASE_URL: postgresql://eos:eos@localhost:5432/eos_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eos
          POSTGRES_PASSWORD: eos
          POSTGRES_DB: eos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate PostgreSQL schema + drift check (single source of truth)
        run: |
          node scripts/gen-postgres-schema.mjs
          git diff --exit-code prisma/schema.postgres.prisma

      - name: Validate the PostgreSQL schema
        run: bunx prisma validate --schema prisma/schema.postgres.prisma

      - name: Production init path — migrate diff from empty must yield real DDL
        run: |
          bunx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.postgres.prisma --script > /tmp/init.sql
          test -s /tmp/init.sql
          grep -q 'CREATE TABLE "Project"' /tmp/init.sql
          echo "init.sql tables: $(grep -c 'CREATE TABLE' /tmp/init.sql)"

      - name: Apply init SQL to the live PostgreSQL service (prisma db execute)
        run: bunx prisma db execute --file /tmp/init.sql --url postgresql://eos:eos@localhost:5432/eos_ci

      - name: db push against the live service (must report — already in sync)
        run: bunx prisma db push --skip-generate --schema prisma/schema.postgres.prisma

      - name: Upgrade-diff loop closed — live-vs-model diff must contain no DDL
        run: |
          bunx prisma migrate diff --from-schema-datasource prisma/schema.postgres.prisma --to-schema-datamodel prisma/schema.postgres.prisma --script > /tmp/upgrade.sql
          if grep -E 'CREATE TABLE|ALTER TABLE|DROP TABLE|CREATE *(UNIQUE )*INDEX|DROP *(UNIQUE )*INDEX' /tmp/upgrade.sql; then
            echo "unexpected DDL in the live-vs-model upgrade diff:"; cat /tmp/upgrade.sql; exit 1
          fi
          echo "live PostgreSQL matches the model — no DDL in upgrade diff"

  # Phase-6 packaging lane (W2-g, contract §2): build the real .deb on a host
  # that has sudo, then smoke-verify install → file layout → removal.
  # Honest scope: GitHub runners have no running systemd, so the service and
  # the sweep timer are NOT started here — this covers the dpkg lifecycle
  # (postinst/prerm/postrm) and the installed file layout only. The units'
  # first real start happens on a systemd host (see
  # docs/07-release/installation-ubuntu.md). First run recorded 2026-10-22
  # on commit bcaf826, after pushes were unblocked.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build .deb (real next build, clean seed DB, dpkg-deb)
        run: bash scripts/build-deb.sh

      - name: Validate desktop entry (desktop-file-utils on runner)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils
          desktop-file-validate packaging/desktop/eos.desktop

      - name: Install nodejs (documented package dependency — mirrors the operator flow)
        run: sudo apt-get install -y -qq nodejs

      - name: Install package (dpkg -i runs maintscripts as root)
        run: sudo dpkg -i dist/*.deb

      - name: Assert installed file layout
        run: |
          set -u
          dump_debug() {
            echo "--- dpkg -s engineering-os ---"; dpkg -s engineering-os | head -20 || true
            echo "--- /etc/eos ---"; sudo ls -la /etc/eos/ || true
            echo "--- /var/lib/engineering-os ---"; sudo ls -la /var/lib/engineering-os/ || true
            echo "--- installed files (dpkg -L, first 40) ---"; dpkg -L engineering-os | sort | head -40 || true
          }
          check() { "$@" || { echo "ASSERT FAILED: $*"; dump_debug; exit 1; }; }
          check test -x /opt/engineering-os/server.js
          check test -x /opt/engineering-os/bin/preflight.sh
          check test -x /opt/engineering-os/bin/orphan-sweep.sh
          check test -f /opt/engineering-os/prisma/schema.prisma
          check test -f /opt/engineering-os/share/engineering-os-seed.db
          check test -d /opt/engineering-os/src/engines/adapters
          check test -f /lib/systemd/system/eos.service
          check test -f /lib/systemd/system/eos-orphan-sweep.service
          check test -f /lib/systemd/system/eos-orphan-sweep.timer
          check test -f /usr/share/applications/eos.desktop
          check test -f /usr/share/icons/hicolor/scalable/apps/eos.svg
          check getent passwd eos
          # /var/lib/engineering-os is 0750 eos:eos BY DESIGN (data dir is
          # service-user-only; the runner cannot traverse into it). Stat the
          # seeded DB with sudo — the perms are the product working as intended.
          check sudo test -f /var/lib/engineering-os/custom.db
          check test -f /etc/eos/eos.env
          # /etc/eos/eos.env is root:eos 0640 BY DESIGN (it holds the session
          # secret — non-root must NOT read it). The assert therefore reads it
          # with sudo; a non-sudo grep would fail on permissions, which is the
          # product working as intended, not a packaging defect.
          check sudo grep -q '^NEXTAUTH_SECRET=.' /etc/eos/eos.env
          check sh -c "dpkg -s engineering-os | grep -q '^Depends: nodejs (>= 18)\$'"
          check sh -c "dpkg -s engineering-os | grep -q '^Status: install ok installed\$'"

      - name: Remove package (prerm + postrm, clean removal)
        run: sudo dpkg -r engineering-os

      - name: Assert removal clean (data retained by design)
        run: |
          test ! -e /opt/engineering-os
          test ! -e /lib/systemd/system/eos.service
          test ! -e /usr/share/applications/eos.desktop
          # retention red line: operator data + config survive removal (manual cleanup documented)
          test -d /var/lib/engineering-os
          # 0750 eos:eos dir (by design) — stat through sudo; see the layout asserts
          sudo test -f /var/lib/engineering-os/custom.db
          test -f /etc/eos/eos.env
          dpkg-query -W -f='${Status}' engineering-os | grep -q '^deinstall ok config-files'

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: engineering-os-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
